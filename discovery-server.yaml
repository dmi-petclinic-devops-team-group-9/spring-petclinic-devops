apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: petclinic  
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-server
  template:
    metadata:
      labels:
        app: discovery-server
    spec:
      imagePullSecrets:
      - name: acr-secret
      containers:
      - name: discovery-server
        image: petclinic11acr.azurecr.io/spring-petclinic-discovery-server:latest    
        ports:
        - containerPort: 8761
        env:
        - name: SPRING_CONFIG_IMPORT
          value: "configserver:http://config-server:8888"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8761
          initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  namespace: petclinic  
spec:
  selector:
    app: discovery-server
  ports:
    - protocol: TCP
      port: 8761
      targetPort: 8761
