trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

variables:
  azureServiceConnection: 'azure-service-connection'
  resourceGroup: 'rg-petclinic11-dev'
  aksName: 'aks-petclinic11-dev'
  acrName: 'petclinic11acr'
  acrLoginServer: 'petclinic11acr.azurecr.io'
  imagePrefix: '$(acrLoginServer)/petclinic'
  namespace: 'petclinic'
  imageTag: '$(Build.BuildId)'
  MAVEN_CACHE_FOLDER: $(HOME)/.m2/repository

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build_Test
  displayName: 'Build and Test All Microservices'
  jobs:
  - job: BuildAndTest
    displayName: 'Compile → Test → Package'
    steps:
    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'
    - task: Cache@2
      inputs:
        key: 'maven | "$(Agent.OS)" | **/pom.xml'
        path: $(MAVEN_CACHE_FOLDER)
    - script: ./mvnw clean install
      displayName: 'Maven Build and Test'
    - task: PublishTestResults@2
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '*/target/surefire-reports/TEST-.xml'

- stage: Docker_Push
  displayName: 'Build and Push Docker Images to ACR'
  dependsOn: Build_Test
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: DockerBuild
    steps:
    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'
    - task: AzureCLI@2
      displayName: 'Login to ACR'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az acr login --name $(acrName)
    - script: |
        chmod +x ./mvnw
        ./mvnw clean install -Dmaven.test.skip=true -P buildDocker \
          -Ddocker.image.prefix=$(imagePrefix) \
          -Dcontainer.build.extraarg="--push" \
          -Dcontainer.platform="linux/amd64"
      displayName: 'Build and Push Service Images'

- stage: Deploy_AKS
  displayName: 'Deploy to AKS using Helm'
  dependsOn: Docker_Push
  jobs:
  - job: Deploy
    steps:
    - task: AzureCLI@2
      displayName: 'Connect to AKS and deploy Helm chart'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az aks get-credentials \
            --resource-group $(resourceGroup) \
            --name $(aksName) \
            --overwrite-existing
          kubectl create namespace $(namespace) --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install petclinic ./helm/petclinic \
            --namespace $(namespace) \
            --set global.imageRegistry=$(imagePrefix) \
            --set global.imageTag=latest
          kubectl rollout status deployment/api-gateway -n $(namespace) --timeout=10m
          kubectl get svc -n $(namespace)