apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: petclinic
  labels:
    grafana_datasource: "1"
data:
  datasource.yaml: |-
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      url: http://prometheus-server.petclinic.svc.cluster.local
      access: proxy
      isDefault: true
