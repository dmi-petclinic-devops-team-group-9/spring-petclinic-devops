# Global registry to avoid repeating the long ACR string
global:
  registry: petclinic11acr.azurecr.io
  imagePullSecret: acr-secret
  namespace: petclinic

# Common resource profiles to keep the nodes healthy
# Java apps generally need at least 512Mi to start safely
profiles:
  infra:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "768Mi"
  apps:
    requests:
      cpu: "200m"
      memory: "768Mi"
    limits:
      cpu: "800m"
      memory: "1Gi"

configServer:
  replicaCount: 1
  image: spring-petclinic-config-server
  tag: latest
  resources: 
    {{- toYaml .Values.profiles.infra | nindent 4 }}
  service:
    port: 8888
    type: ClusterIP

discoveryServer:
  replicaCount: 1
  image: spring-petclinic-discovery-server
  tag: latest
  resources: 
    {{- toYaml .Values.profiles.infra | nindent 4 }}
  service:
    port: 8761
    type: ClusterIP

apiGateway:
  replicaCount: 1
  image: spring-petclinic-api-gateway
  tag: latest
  resources: 
    {{- toYaml .Values.profiles.apps | nindent 4 }}
  service:
    port: 80
    targetPort: 8080
    type: LoadBalancer

customersService:
  replicaCount: 1
  image: spring-petclinic-customers-service
  tag: latest
  resources: 
    {{- toYaml .Values.profiles.apps | nindent 4 }}
  service:
    port: 8081
    type: ClusterIP

vetsService:
  replicaCount: 1
  image: spring-petclinic-vets-service
  tag: latest
  resources: 
    {{- toYaml .Values.profiles.apps | nindent 4 }}
  service:
    port: 8083
    type: ClusterIP

visitsService:
  replicaCount: 1
  image: spring-petclinic-visits-service
  tag: latest
  resources: 
    {{- toYaml .Values.profiles.apps | nindent 4 }}
  service:
    port: 8082
    type: ClusterIP

genaiService:
  replicaCount: 1
  image: spring-petclinic-genai-service
  tag: latest
  resources: 
    {{- toYaml .Values.profiles.apps | nindent 4 }}
  service:
    port: 8084
    type: ClusterIP

adminServer:
  replicaCount: 1
  image: spring-petclinic-admin-server
  tag: latest
  resources: 
    {{- toYaml .Values.profiles.infra | nindent 4 }}
  service:
    port: 9090
    type: ClusterIP
