apiVersion: v1
kind: Service
metadata:
  name: genai-service
  labels:
    app: genai-service
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    app: genai-service
  ports:
    - port: {{ .Values.genaiService.service.port }}
      targetPort: {{ .Values.genaiService.service.port }}
  type: {{ .Values.genaiService.service.type }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genai-service
  labels:
    app: genai-service
spec:
  replicas: {{ .Values.genaiService.replicaCount }}
  selector:
    matchLabels:
      app: genai-service
  template:
    metadata:
      labels:
        app: genai-service
    spec:
      containers:
      - name: genai-service
        image: "{{ .Values.global.registry }}/{{ .Values.genaiService.image }}:{{ .Values.global.tag }}"
        resources:
          {{- toYaml .Values.genaiService.resources | nindent 10 }}
        ports:
        - containerPort: {{ .Values.genaiService.service.port }}

        readinessProbe:
          httpGet:
            path: /actuator/health
            port: {{ .Values.genaiService.service.port }}
          initialDelaySeconds: 30
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /actuator/health
            port: {{ .Values.genaiService.service.port }}
          initialDelaySeconds: 60
          periodSeconds: 15

        # Automatically maps all key-value pairs from openai-secret into environment variables
        env:
        - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
          value: http://zipkin.petclinic.svc.cluster.local:9411/api/v2/spans
        - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
          value: "1.0"
        envFrom:
        - secretRef:
            name: openai-secret
